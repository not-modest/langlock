<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Langlock</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.mjs" type="module"></script>
  </head>
  <body>
    <main>
      <h1><img src="icons/icon-48.png" width="28" height="28" alt=""> Langlock</h1>
      <fieldset id="settings" disabled>
        <label class="toggle">
          <input id="enabled" type="checkbox">
          <span>Use a fixed interface language</span>
        </label>
        <label for="language">Interface language</label>
        <select id="language"></select>
      </fieldset>
      <p id="status" role="status">Applies when you open or reload Scholar.</p>
    </main>
  </body>
</html>
